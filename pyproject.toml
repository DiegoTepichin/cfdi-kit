[project]
name = "cfdi-kit"
version = "0.0.0"
description = "Parse SAT CFDI invoices (XML) into dataframes, Excel and a local income / expense / VAT report. Nothing leaves your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Tepichin" }]
requires-python = ">=3.11"
keywords = ["cfdi", "sat", "mexico", "factura", "invoice", "xml", "iva", "pandas", "accounting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/DiegoTepichin/cfdi-kit"
Repository = "https://github.com/DiegoTepichin/cfdi-kit"
Issues = "https://github.com/DiegoTepichin/cfdi-kit/issues"

[project.scripts]
cfdi-kit = "cfdi_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.es.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "ANN", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"examples/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-openpyxl>=3.1.5.20261017",
]
